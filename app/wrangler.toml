name = "social-manager"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
workers_dev = true

# No [limits] block: the account is on the Workers Free plan, where setting
# `cpu_ms` makes every deploy fail ("CPU limits are not supported for the
# Free plan" [code: 100328]). Paid already defaults to 30000ms, so if the
# account goes back to Workers Paid nothing needs re-adding here.

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# ── D1 binding ────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "social-manager"
database_id = "750d454e-c01f-4a68-a96e-2faee4fa5d4d"
migrations_dir = "drizzle/migrations"

# ── Env vars (non-secret). Secrets via `wrangler secret put` or GH Actions.
[vars]
APP_RUNTIME = "cloudflare"
INITIAL_ADMIN_USERNAME = "admin"

# ── TikTok fetch proxy (workers/tiktok-fetcher) ──────────────────
# TikTok redirects requests from Hong Kong colos; src/lib/tiktok.ts sends
# TikTok page fetches through this Worker's NA/EU Durable Objects.
[[services]]
binding = "TIKTOK_FETCHER"
service = "social-manager-tiktok"
