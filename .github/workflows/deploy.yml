name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x requires Node >= 22. On Node 20 the project's wrangler
          # can't start, so wrangler-action silently installed wrangler 3.90
          # over it and every deploy failed.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build (opennextjs)
        working-directory: app
        run: npm run cf:build

      # Apply D1 migrations BEFORE Worker deploy — guarantees the schema
      # the deployed code expects is in place. Wrangler's migrations
      # tracking is idempotent (records applied .sql in a `d1_migrations`
      # table on the D1 itself), so re-runs are no-ops once a migration
      # has been applied. Step fails the workflow if the migration errors,
      # which prevents shipping code that references a not-yet-applied
      # schema change.
      # Uses the project's pinned wrangler (not wrangler-action, which can
      # swap in its own older version).
      - name: Apply D1 migrations
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply social-manager --remote

      # Plain `npx wrangler deploy` (project's pinned wrangler) instead of
      # wrangler-action, which hides the real error inside a collapsed group.
      # On failure the log tail is re-emitted as ::error:: annotations so it
      # shows on the run summary page.
      - name: Deploy Worker
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            # One annotation (GitHub caps them per step): ERROR blocks with
            # context, ANSI colors stripped, newlines encoded as %0A.
            msg=$(sed -e 's/\x1b\[[0-9;]*m//g' deploy.log | grep -v '^\s*$' \
              | grep -A8 -E 'ERROR|✘' | head -n 40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=wrangler deploy::${msg}"
            exit 1
          fi
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' deploy.log | head -n 1)
          echo "::notice title=Deployed::${url:-deploy OK}"
          # No `secrets:` upload here. The old ENC_KEY upload ran BEFORE the
          # deploy and, once it started failing ("Failed to upload secrets"),
          # blocked every deploy — while the app never read ENC_KEY (crypto
          # uses ENCRYPTION_KEY). `wrangler deploy` keeps the Worker's
          # existing secrets; manage them with `wrangler secret put`.
          # Never change ENCRYPTION_KEY on a live Worker — stored credentials
          # would no longer decrypt.
